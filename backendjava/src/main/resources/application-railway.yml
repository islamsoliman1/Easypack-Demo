server:
  address: 0.0.0.0
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100
    accept-count: 20
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 60000
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
easyback:
  secure-cookies: true
  allowed-origins: ${ALLOWED_ORIGINS}
  railway:
    spa-enabled: ${RAILWAY_SPA_ENABLED:true}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
