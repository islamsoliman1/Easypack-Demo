server:
  port: 8080
  error:
    include-message: never
spring:
  application:
    name: easyback-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/easyback}
    username: ${DB_USER:easyback}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
easyback:
  jwt-secret: ${JWT_SECRET}
  issuer: easyback-api
  audience: easyback-app
  secure-cookies: ${SECURE_COOKIES:true}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
